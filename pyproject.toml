[project]
name = "finance-tracker"
version = "0.1.0"
description = "Local-first finance tracker: FastAPI backend + SQLite, packaged as a desktop app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.32",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

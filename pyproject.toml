[project]
name = "finance-tracker"
version = "0.1.0"
description = "Local-first finance tracker: FastAPI backend + SQLite, packaged as a desktop app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
finance-tracker = "finance_tracker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_tracker"]
